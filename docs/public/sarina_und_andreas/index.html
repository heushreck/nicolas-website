<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#eef4f7">
  <title>Sarina und Andreas Spielewiese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --sky:#eef4f7; --bg:#f6f8f7; --paper:#fff; --ink:#1f2d38; --muted:#66757f; --line:#e1e8e5;
      --forest:#2f5d4a; --red:#d9534f; --meadow:#a9cf8f;
      --serif:Fraunces, Georgia, serif;
      --sans:Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    a{color:inherit}
    img{display:block;max-width:100%}
    .hidden{display:none !important}

    /* ---------- lock ---------- */
    #lock{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:linear-gradient(var(--sky),var(--bg));transition:opacity .6s}
    #lock.fade{opacity:0}
    .lockCard{width:min(360px,100%);text-align:center}
    .lockCard img{width:240px;margin:0 auto 10px}
    .lockCard h1{margin:0;font:700 26px/1.2 var(--serif)}
    .lockCard p{margin:4px 0 20px;color:var(--muted)}
    .field{display:flex;gap:8px;padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 28px rgba(47,93,74,.1)}
    .field input{flex:1;min-width:0;border:0;background:none;padding:8px 14px;outline:none}
    .field button{border:0;border-radius:999px;padding:8px 18px;background:var(--forest);color:#fff;font-weight:500}
    .field button:hover{background:#264d3d}
    .field.bad{animation:shake .4s}
    @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    .lockCard .lockMsg{min-height:1.6em;margin:12px 0 0;font-size:14px}
    .lockMsg.bad{color:var(--red)}

    /* ---------- page ---------- */
    /* Every screen fits the window: the start page is one scene the size of the window, and on a
       game screen the stage fills the space below the header, so each game sizes itself to that. */
    #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
    body.playing #app{height:max(100vh,560px);height:max(100dvh,560px)}

    /* ---------- home ---------- */
    /* One scene the size of the window: sky and mountains on top, then a meadow, and a trail that
       winds up from the bottom edge past the four games to the hut at the foot of the mountain. */
    .home{position:relative;isolation:isolate;display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:540px;overflow:hidden}
    .sky{position:relative;flex:none;height:clamp(190px,38dvh,420px);background:linear-gradient(var(--sky),#f8fbfb 70%)}
    .peaks{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
    .sun{position:absolute;left:13%;top:16%;width:50px;height:50px;border-radius:50%;background:#f5d06e;box-shadow:0 0 0 16px rgba(248,231,179,.55)}
    .cloud{position:absolute;right:9%;top:12%;width:clamp(70px,9vw,130px);fill:#fff;animation:drift 26s ease-in-out infinite alternate}
    .cloud + .cloud{right:auto;left:22%;top:34%;width:clamp(48px,6vw,84px);opacity:.9;animation-duration:34s;animation-direction:alternate-reverse}
    @keyframes drift{to{transform:translateX(40px)}}
    .home h1{position:relative;margin:0;padding:clamp(18px,4dvh,44px) 16px 0;text-align:center;font-weight:400}
    .home .names{display:block;font:700 clamp(30px,5.4vw,56px)/1.05 var(--serif);letter-spacing:-.01em}
    .home .arcade{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.8);font:600 12px/1.4 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--forest)}
    .meadow{position:relative;flex:1;min-height:0;margin-top:-2px;background:url(/sarina_und_andreas/art/home-meadow.svg) 0 0/360px auto,linear-gradient(var(--meadow),#9cc883)}
    .trail{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
    .trail path{fill:#efe7d1;stroke:#d8c9a0;stroke-width:1.5;stroke-linejoin:round}
    .trees{position:absolute;bottom:20px;left:-34px;height:min(48dvh,420px);pointer-events:none}
    .trees + .trees{left:auto;right:-34px;transform:scaleX(-1)}
    .home footer{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 16px 5px;background:url(/sarina_und_andreas/art/home-grass.svg) repeat-x center bottom/auto 46px;text-align:right;font-size:12px;color:var(--forest)}

    /* The games stop along the trail, the first at the bottom. On wide screens they take turns on
       either side of it with their signs facing out; on narrow ones they sit at alternate edges,
       signs facing in. */
    .stops{position:absolute;inset:6px 16px 56px;z-index:2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);column-gap:150px;max-width:980px;margin:0 auto}
    .stop{align-self:center;display:flex;align-items:center;gap:12px;text-decoration:none;outline:none}
    .stop:nth-child(1){grid-area:4/1/6/2}
    .stop:nth-child(2){grid-area:3/2/5/3}
    .stop:nth-child(3){grid-area:2/1/4/2}
    .stop:nth-child(4){grid-area:1/2/3/3}
    .stop:nth-child(odd){justify-self:end;flex-direction:row-reverse;text-align:right}
    .stop:nth-child(even){justify-self:start}
    .badge{flex:none;display:grid;place-items:center;width:84px;height:84px;border:4px solid #fff;border-radius:50%;background:var(--tint);box-shadow:0 6px 16px rgba(31,45,56,.18);transition:transform .3s}
    .badge img{width:58px;height:58px}
    .label{max-width:290px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.94);box-shadow:0 8px 22px rgba(31,45,56,.12);transition:transform .25s,box-shadow .25s}
    .label .blaze{vertical-align:2px}
    .label b{margin-left:8px;font:600 19px/1.25 var(--serif)}
    .label small{display:block;margin-top:2px;font-size:13px;line-height:1.4;color:var(--muted)}
    .stop:hover .badge,.stop:focus-visible .badge{transform:translateY(-4px) rotate(-6deg)}
    .stop:hover .label,.stop:focus-visible .label{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,45,56,.16)}
    .stop:focus-visible .label{outline:3px solid var(--forest);outline-offset:2px}
    .wip{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;background:#f1f4f2;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

    .wrap{width:min(880px,100%);margin:0 auto;padding:0 16px}
    main.wrap{flex:1 0 auto;padding-top:6px;padding-bottom:16px}
    body.playing main.wrap{display:flex;flex-direction:column;flex:1 1 0;min-height:0;width:min(1080px,100%);padding-top:22px}

    /* the red-white-red stripe that marks Alpine hiking trails, with the game number on it */
    .blaze{display:inline-grid;place-items:center;width:34px;height:22px;border-radius:3px;background:linear-gradient(var(--red) 0 24%,#fff 24% 76%,var(--red) 76%);box-shadow:0 0 0 1px rgba(0,0,0,.08);font:700 11px/1 var(--sans);color:var(--ink)}

    /* ---------- game screen ---------- */
    /* a slim version of the start page: sky, the game's name in the middle, a mountain ridge below */
    .topbar{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:150px;padding:12px 16px 74px;background:url(/sarina_und_andreas/art/ridge.svg) repeat-x center bottom/auto 110px,linear-gradient(var(--sky),#f8fbfb)}
    .topbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;background:linear-gradient(var(--meadow),var(--bg))}
    .back{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(47,93,74,.12);font:600 14px/1 var(--sans);color:var(--forest);text-decoration:none;transition:background .2s,box-shadow .2s}
    .back:hover{background:#fff;box-shadow:0 4px 14px rgba(47,93,74,.18)}
    .back svg{transition:transform .2s}
    .back:hover svg{transform:translateX(-2px)}
    .help{justify-self:end;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(47,93,74,.12);font:700 17px/1 var(--sans);color:var(--forest);cursor:pointer;transition:background .2s,box-shadow .2s}
    .help:hover{background:#fff;box-shadow:0 4px 14px rgba(47,93,74,.18)}
    .barTitle{text-align:center}
    .barTitle h1{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;font:700 26px/1.2 var(--serif)}
    .barTitle p{margin:2px 0 0;font-size:14px;color:var(--muted)}
    .stage{flex:1;min-height:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:auto}
    .soon{max-width:460px;margin:0 auto;padding:36px 22px 40px;text-align:center}
    .soon h3{margin:0 0 4px;font:600 21px/1.3 var(--serif)}
    .soon > p{margin:0 0 18px;color:var(--muted)}
    .steps{margin:0;padding:0;list-style:none;text-align:left;counter-reset:s}
    .steps li{position:relative;padding:10px 0 10px 40px;border-top:1px solid var(--line);counter-increment:s}
    .steps li::before{content:counter(s);position:absolute;left:0;top:9px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sky);font-weight:600;font-size:13px;color:var(--forest)}
    .sign{display:inline-block;margin-bottom:16px;padding:6px 14px;border-radius:6px;background:#f2c14e;font:700 12px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#3b3220;transform:rotate(-2deg)}

    body.playing .home,body:not(.playing) .topbar,body:not(.playing) main{display:none}

    /* narrow screens: one stop per row, at alternate edges */
    @media (max-width:900px){
      .stops{inset:4px 12px 52px;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);column-gap:0}
      .stop:nth-child(1){grid-area:4/1}
      .stop:nth-child(2){grid-area:3/1}
      .stop:nth-child(3){grid-area:2/1}
      .stop:nth-child(4){grid-area:1/1}
      .stop:nth-child(odd){justify-self:start;flex-direction:row;text-align:left}
      .stop:nth-child(even){justify-self:end;flex-direction:row-reverse;text-align:right}
      .trees{display:none}
    }
    /* short windows: smaller stops so all four fit between the mountains and the grass */
    @media (max-height:720px){
      .home .names{font-size:clamp(28px,4.6vw,44px)}
      .badge{width:64px;height:64px;border-width:3px}
      .badge img{width:46px;height:46px}
      .label{padding:7px 12px}
      .label b{font-size:16px}
      .label small{font-size:12.5px;line-height:1.35}
    }
    /* phones: a lower sky, the sun beside the mountains, smaller stops */
    @media (max-width:600px){
      .sky{height:clamp(170px,34dvh,320px)}
      .sun{left:7%;top:50%;width:34px;height:34px;box-shadow:0 0 0 10px rgba(248,231,179,.55)}
      .badge{width:62px;height:62px;border-width:3px}
      .badge img{width:44px;height:44px}
      .label{padding:8px 12px;border-radius:14px}
      .label b{font-size:16px}
      .label small{font-size:12.5px}
    }
    @media (max-width:600px) and (max-height:620px){
      .badge{width:52px;height:52px}
      .badge img{width:38px;height:38px}
      .label small{font-size:12px}
    }
    /* big screens: bigger stops */
    @media (min-width:1200px) and (min-height:840px){
      .stops{column-gap:180px;max-width:1080px}
      .badge{width:100px;height:100px;border-width:5px}
      .badge img{width:70px;height:70px}
      .label{max-width:330px;padding:12px 16px}
      .label b{font-size:22px}
      .label small{font-size:14px}
    }
    @media (max-width:600px){
      .topbar{height:104px;padding:8px 12px 50px;background-size:auto 76px,auto}
      .back{padding:8px}
      .back span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
      .barTitle h1{gap:8px;font-size:20px}
      .barTitle p{display:none}
      body.playing main.wrap{padding-top:18px;padding-bottom:10px}
    }
    /* short windows give the game the height a tall band would take */
    @media (min-width:601px) and (max-height:720px){
      .topbar{height:110px;padding:8px 16px 54px;background-size:auto 80px,auto}
      .barTitle h1{font-size:22px}
      .barTitle p{display:none}
      body.playing main.wrap{padding-top:16px;padding-bottom:12px}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
  </style>
</head>
<body>

<div id="lock">
  <form class="lockCard" id="lockForm" autocomplete="off">
    <img src="/sarina_und_andreas/art/lock.svg" alt="" width="240" height="160">
    <h1>Sarina und Andreas</h1>
    <p>Spielewiese. Gebt das Passwort ein, dann geht’s los.</p>
    <div class="field" id="field">
      <input id="pw" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="off" required>
      <button type="submit">Los</button>
    </div>
    <p class="lockMsg" id="lockMsg" role="status"></p>
  </form>
</div>

<div id="app" class="hidden">
  <section class="home" id="home">
    <div class="sky">
      <span class="sun"></span>
      <svg class="cloud" viewBox="0 0 120 50" aria-hidden="true"><rect y="24" width="120" height="26" rx="13"/><circle cx="50" cy="25" r="24"/><circle cx="79" cy="29" r="17"/></svg>
      <svg class="cloud" viewBox="0 0 120 50" aria-hidden="true"><rect y="24" width="120" height="26" rx="13"/><circle cx="50" cy="25" r="24"/><circle cx="79" cy="29" r="17"/></svg>
      <img class="peaks" id="peaks" src="/sarina_und_andreas/art/home-peaks.svg" alt="">
      <h1><span class="names">Sarina und Andreas</span><span class="arcade">Spielewiese</span></h1>
    </div>
    <div class="meadow">
      <img class="trees" src="/sarina_und_andreas/art/home-trees.svg" alt="">
      <img class="trees" src="/sarina_und_andreas/art/home-trees.svg" alt="">
      <nav class="stops" id="stops" aria-label="Spiele"></nav>
      <footer>von Nicolas für Sarina und Andreas</footer>
    </div>
    <svg class="trail" id="trail" aria-hidden="true"></svg>
  </section>
  <nav class="topbar">
    <a class="back" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Alle Spiele</span></a>
    <div class="barTitle" id="barTitle"></div>
    <button type="button" class="help" id="help" aria-label="So geht’s" title="So geht’s" hidden>?</button>
  </nav>
  <main class="wrap" id="view"></main>
</div>

<script type="module">
import { GAMES } from '/sarina_und_andreas/games.js';
import { openTutorial, seenTutorial } from '/sarina_und_andreas/tutorial.js';

// Only a hash of the password lives here. The repo is public, so the gate keeps the page out of
// casual view and nothing more.
const CHECK_HASH = 'bfc2f8752d73ee39dd7a1309478da89f7095f8f5f1d8d1b0790d0a318af4d76e';
const AUTH_KEY = 'sa-arcade-auth-v1';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const storeGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const storeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------------- lock ---------------- */
function boot() {
  if (storeGet(AUTH_KEY) === CHECK_HASH) return enter(false);
  $('#pw').focus();
  $('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('#lockMsg'), field = $('#field');
    if (await sha256('sa-arcade-check:' + $('#pw').value.trim().toLowerCase()) !== CHECK_HASH) {
      field.classList.remove('bad'); void field.offsetWidth; field.classList.add('bad');
      msg.className = 'lockMsg bad'; msg.textContent = 'Leider falsch. Versucht’s nochmal.';
      return;
    }
    storeSet(AUTH_KEY, CHECK_HASH);
    msg.className = 'lockMsg'; msg.textContent = 'Servus! Kommt rein.';
    setTimeout(() => enter(true), 600);
  });
}
function enter(animate) {
  const lock = $('#lock');
  if (animate) { lock.classList.add('fade'); setTimeout(() => lock.remove(), 600); } else lock.remove();
  $('#app').classList.remove('hidden');
  $('#stops').innerHTML = GAMES.map(g => `
    <a class="stop" href="#play/${g.id}" style="--tint:${g.tint}">
      <span class="badge"><img src="/sarina_und_andreas/art/${g.icon}" alt="" width="58" height="58"></span>
      <span class="label">${blaze(g.n)}<b>${esc(g.title)}</b><small>${esc(g.tagline)}</small>${g.ready ? '' : '<span class="wip">In Arbeit</span>'}</span>
    </a>`).join('');
  // the trail follows the badges, so it is drawn again whenever the page changes size, including
  // when the start page comes back from a game
  new ResizeObserver(drawTrail).observe($('#home'));
  route();
  addEventListener('hashchange', route);
}

/* ---------------- routing ---------------- */
// '#' is the game picker, '#play/<id>' opens a game.
let stopGame = null;
let closeTutorial = null;
function route() {
  stopGame?.(); stopGame = null;
  closeTutorial?.(); closeTutorial = null;
  const [view, id] = location.hash.slice(1).split('/');
  const game = view === 'play' && GAMES.find(g => g.id === id);
  document.body.classList.toggle('playing', Boolean(game));
  if (game) playScreen(game); else $('#view').replaceChildren();
  scrollTo({ top: 0 });
}

const blaze = n => `<span class="blaze" aria-hidden="true">${n}</span>`;

/* ---------------- home ---------------- */
// The trail runs from the bottom edge through each game's badge to the hut's door, narrowing as it
// climbs into the distance. PEAKS is the size of home-peaks.svg and the door's spot in it; the
// picture fills the sky like object-fit: cover, anchored at the bottom.
const PEAKS = { w: 2400, h: 500, door: [1343, 418] };
function drawTrail() {
  const home = $('#home').getBoundingClientRect();
  if (!home.width) return;
  const sky = $('#peaks').getBoundingClientRect();
  const s = Math.max(sky.width / PEAKS.w, sky.height / PEAKS.h);
  const door = [sky.left - home.left + (sky.width - PEAKS.w * s) / 2 + PEAKS.door[0] * s,
                sky.bottom - home.top - (PEAKS.h - PEAKS.door[1]) * s];
  const badges = [...$('#stops').querySelectorAll('.badge')].map(b => {
    const r = b.getBoundingClientRect();
    return [r.left + r.width / 2 - home.left, r.top + r.height / 2 - home.top];
  });
  const via = [[home.width / 2, home.height + 20], ...badges, door];
  // every leg leaves and reaches its ends heading straight up, so the trail snakes from side to side
  const line = [];
  for (let i = 1; i < via.length; i++) {
    const [x0, y0] = via[i - 1], [x1, y1] = via[i], k = (y0 - y1) * 0.6;
    for (let t = 0; t < 1; t += 1 / 32) {
      const u = 1 - t;
      line.push([(u ** 3 + 3 * u * u * t) * x0 + (3 * u * t * t + t ** 3) * x1,
                 u ** 3 * y0 + 3 * u * u * t * (y0 - k) + 3 * u * t * t * (y1 + k) + t ** 3 * y1]);
    }
  }
  line.push(door);
  // the farther up, the farther away: the width shrinks with the height on screen
  const w0 = Math.min(54, home.width * 0.11), w1 = 3;
  const left = [], right = [];
  line.forEach(([x, y], i) => {
    const [ax, ay] = line[Math.max(i - 1, 0)], [bx, by] = line[Math.min(i + 1, line.length - 1)];
    const near = Math.min(Math.max((y - door[1]) / (home.height - door[1]), 0), 1);
    const half = (w1 + (w0 - w1) * near) / 2 / (Math.hypot(bx - ax, by - ay) || 1);
    left.push(`${(x - (by - ay) * half).toFixed(1)},${(y + (bx - ax) * half).toFixed(1)}`);
    right.push(`${(x + (by - ay) * half).toFixed(1)},${(y - (bx - ax) * half).toFixed(1)}`);
  });
  $('#trail').setAttribute('viewBox', `0 0 ${home.width} ${home.height}`);
  $('#trail').innerHTML = `<path d="M${left.join('L')}L${right.reverse().join('L')}Z"/>`;
}

async function playScreen(g) {
  $('#barTitle').innerHTML = `<h1>${blaze(g.n)}${esc(g.title)}</h1><p>${esc(g.tagline)}</p>`;
  $('#view').innerHTML = '<section class="stage" id="stage"></section>';
  $('#help').hidden = true;
  const stage = $('#stage');
  if (!g.ready) {
    stage.innerHTML = `
      <div class="soon">
        <span class="sign">Weg im Bau</span>
        <h3>Dieses Spiel ist noch in Arbeit</h3>
        <p>So wird es funktionieren:</p>
        <ol class="steps">${g.steps.map(s => `<li>${esc(s.text)}</li>`).join('')}</ol>
      </div>`;
    return;
  }
  // A game module draws into the stage and may return a function that cleans up when the player
  // leaves. It may also export INTRO_ART, shown at the top of its "So geht’s" pop-up.
  const { start, INTRO_ART } = await import(`/sarina_und_andreas/games/${g.id}.js`);
  if (location.hash !== `#play/${g.id}`) return;
  const tutorial = () => { closeTutorial = openTutorial(g, INTRO_ART); };
  $('#help').onclick = tutorial;
  $('#help').hidden = false;
  if (!seenTutorial(g.id)) tutorial();
  stopGame = await start(stage, { game: g }) || null;
}

boot();
</script>
</body>
</html>
