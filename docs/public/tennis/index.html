<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4efe1">
  <title>Nicolas & Felix Tennis Score</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f4efe1; --paper:#fffaf0; --ink:#1b1b2a; --muted:#6c6a63; --line:#d9d1bd;
      --ball:#d9f24b; --ball-dark:#a9c21f;
      --nico:#e2483d; --nico-soft:#fbd9d5;
      --felix:#2e9b57; --felix-soft:#d3eedc;
      --court:#3c8d5a; --clay:#d9733f;
      --pixel:"Press Start 2P", ui-monospace, monospace;
      --sans:Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    canvas,img.px{image-rendering:pixelated;image-rendering:crisp-edges}
    .hidden{display:none !important}

    /* ---------- lock screen ---------- */
    #lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--bg);transition:opacity .5s}
    #lock.fade{opacity:0;pointer-events:none}
    .lockCard{width:min(360px,100%);text-align:center}
    .lockBall{height:72px;position:relative}
    .lockBall img{position:absolute;left:50%;bottom:0;width:30px;translate:-50% 0;animation:hop .9s cubic-bezier(.3,0,.7,1) infinite alternate}
    @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-44px)}}
    .lockCard h1{font:12px/1.6 var(--pixel);letter-spacing:.06em;margin:18px 0 18px}
    .lockForm{display:flex;gap:8px}
    .lockForm input{flex:1;min-width:0;padding:12px 14px;border:3px solid var(--ink);border-radius:0;background:var(--paper);font:13px var(--pixel);outline:none;letter-spacing:.08em}
    .lockForm input:focus{box-shadow:4px 4px 0 var(--ball-dark)}
    .lockForm input.ok{background:var(--felix-soft);border-color:var(--felix);color:var(--felix)}
    .lockForm input.bad{animation:shake .35s}
    @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .lockMsg{min-height:22px;margin-top:12px;font:10px/1.8 var(--pixel);color:var(--muted)}
    .lockMsg.ok{color:var(--felix)} .lockMsg.bad{color:var(--nico)}

    /* ---------- shared bits ---------- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:3px solid var(--ink);background:var(--ball);font:11px var(--pixel);letter-spacing:.04em;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
    .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
    .btn.ghost{background:var(--paper)}
    .btn.danger{background:var(--nico);color:#fff}
    .card{background:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
    .eyebrow{font:9px/1.6 var(--pixel);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0}
    .seg{display:inline-flex;border:3px solid var(--ink);background:var(--paper)}
    .seg button{border:0;background:transparent;padding:8px 10px;font:9px var(--pixel);letter-spacing:.04em;color:var(--muted)}
    .seg button+button{border-left:3px solid var(--ink)}
    .seg button.on{background:var(--ink);color:var(--ball)}
    .n{color:var(--nico)} .f{color:var(--felix)}

    /* ---------- layout ---------- */
    .wrap{width:min(1000px,100%);margin:0 auto;padding:0 16px}
    header.top{position:relative;padding-top:18px}
    #rally{display:block;width:100%;height:190px}
    .title{position:absolute;left:0;right:0;top:34px;text-align:center;pointer-events:none}
    .title h1{margin:0;font:clamp(14px,3.2vw,26px)/1.5 var(--pixel);letter-spacing:.02em}
    .title h1 .amp{color:var(--ball-dark)}
    .title p{margin:6px 0 0;font:clamp(8px,1.6vw,11px)/1.6 var(--pixel);color:var(--muted);letter-spacing:.2em}
    #modeBanner{margin:10px 0 0;padding:10px 12px;border:3px dashed var(--clay);background:#fdebd9;font-size:13px}

    section{margin-top:28px}
    .secHead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .secHead h2{margin:0;font:13px/1.6 var(--pixel);display:flex;align-items:center;gap:10px}
    .secHead h2 img{width:18px}

    /* chart */
    .chartCard{padding:16px 16px 10px}
    .chartTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .lead{font:22px/1.2 var(--pixel)}
    .leadSub{font-size:13px;color:var(--muted);margin-top:6px}
    .chartCtrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    #chartBox{position:relative;margin-top:14px}
    #chart{display:block;width:100%;height:240px;overflow:visible}
    #tip{position:absolute;pointer-events:none;padding:7px 9px;background:var(--ink);color:#fff;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
    #tip b{font:9px var(--pixel);color:var(--ball)}
    .empty{padding:40px 10px;text-align:center;color:var(--muted)}
    .empty img{width:120px;display:block;margin:0 auto 14px}

    /* stats */
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .stat{padding:14px;min-width:0}
    .stat .big{font:20px/1.3 var(--pixel);margin-top:8px}
    .stat .sub{font-size:13px;color:var(--muted);margin-top:4px}
    .stat.wide{grid-column:span 2}
    .tug{display:flex;height:16px;margin-top:10px;border:3px solid var(--ink)}
    .tug i{display:block;height:100%}
    .tug i.n{background:var(--nico)} .tug i.f{background:var(--felix)}
    .tugLbl{display:flex;justify-content:space-between;margin-top:8px;font:10px var(--pixel)}
    .pair{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:10px;font-size:13px;align-items:baseline}
    .pair b{font:11px var(--pixel)}

    .divider{display:flex;justify-content:center;align-items:center;gap:14px;margin:34px 0 0}
    .divider img{height:54px}
    .divider:before,.divider:after{content:"";flex:1;border-top:3px dotted var(--line)}

    /* history */
    .hist{display:flex;flex-direction:column;gap:10px}
    .row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
    .row:hover{background:#fff}
    .row .date{font:9px/1.6 var(--pixel);color:var(--muted)}
    .row .sets{display:flex;gap:8px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:2px solid var(--ink);font:11px var(--pixel);background:#fff}
    .chip.wn{background:var(--nico-soft)} .chip.wf{background:var(--felix-soft)}
    .chip small{font:600 10px var(--sans);color:var(--muted);letter-spacing:.02em}
    .row .who{font:9px var(--pixel);text-align:right}
    .more{margin-top:12px;text-align:center}

    footer{margin:40px 0 110px;padding-top:16px;border-top:3px dotted var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
    footer button{border:0;background:none;padding:0;font:9px var(--pixel);color:var(--nico)}
    footer code{font:10px var(--pixel);color:var(--ink);background:var(--ball);padding:2px 5px}

    /* FAB */
    #fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:20;width:68px;height:68px;border:3px solid var(--ink);background:var(--ball);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
    #fab:active{transform:translate(4px,4px);box-shadow:none}
    #fab img{width:36px}
    #fab span{position:absolute;right:calc(100% + 10px);white-space:nowrap;font:9px var(--pixel);background:var(--ink);color:#fff;padding:6px 8px;opacity:0;transition:opacity .2s;pointer-events:none}
    #fab:hover span{opacity:1}

    /* modal */
    dialog{padding:0;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--paper);width:min(440px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto}
    dialog::backdrop{background:rgba(27,27,42,.55)}
    .mHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:3px solid var(--ink);background:var(--ball)}
    .mHead h3{margin:0;font:12px var(--pixel)}
    .x{border:0;background:none;font:14px var(--pixel);padding:4px}
    .mBody{padding:16px}
    label.fld{display:block;font:9px var(--pixel);letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
    input[type=date]{width:100%;padding:10px 12px;border:3px solid var(--ink);border-radius:0;background:#fff;font:600 15px var(--sans);min-height:48px}
    .setBox{margin-top:16px;padding:12px;border:3px solid var(--ink);background:#fff}
    .setTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .setTop b{font:10px var(--pixel)}
    .setTop button{border:0;background:none;font:9px var(--pixel);color:var(--nico);padding:4px}
    .pick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;align-items:center;margin-top:10px}
    .pick .nm{grid-column:1/-1;font:9px var(--pixel);display:flex;align-items:center;gap:6px}
    .pick .nm img{width:16px;height:20px;object-fit:cover;object-position:top}
    .pick button{height:40px;min-width:0;border:2px solid var(--ink);background:var(--paper);font:11px var(--pixel);padding:0}
    .pick.n button.on{background:var(--nico);color:#fff}
    .pick.f button.on{background:var(--felix);color:#fff}
    .verdict{margin-top:10px;font-size:13px;color:var(--muted);min-height:20px}
    .verdict .tag{font:8px var(--pixel);padding:3px 5px;background:var(--clay);color:#fff;margin-left:4px;vertical-align:1px}
    .addSet{margin-top:12px;width:100%;padding:10px;border:3px dashed var(--ink);background:transparent;font:10px var(--pixel)}
    .mFoot{display:flex;gap:10px;padding:0 16px 16px;flex-wrap:wrap}
    .mFoot .btn{flex:1}
    .mErr{color:var(--nico);font-size:13px;padding:0 16px 10px}

    /* celebration */
    #party{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(27,27,42,.72);animation:fadeIn .25s}
    @keyframes fadeIn{from{opacity:0}}
    .partyCard{position:relative;width:min(420px,100%);background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);text-align:center;padding:18px 16px 18px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
    @keyframes pop{from{transform:scale(.6);opacity:0}}
    #partyCanvas{display:block;width:100%;height:300px}
    .partyCard h3{margin:4px 0 6px;font:16px/1.5 var(--pixel)}
    .partyCard p{margin:0 0 14px;color:var(--muted)}

    @media (max-width:820px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:560px){
      #rally{height:150px} .title{top:22px}
      .row{grid-template-columns:1fr auto;gap:8px} .row .date{grid-column:1/-1}
      .stat .big{font-size:16px} .stats{gap:10px}
      .lead{font-size:17px}
      .chartCtrls{justify-content:flex-start}
    }
  </style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lock">
  <div class="lockCard">
    <div class="lockBall"><img class="px" id="lockBall" alt=""></div>
    <h1>ENTER PASSWORD</h1>
    <form class="lockForm" id="lockForm" autocomplete="off">
      <input id="pw" type="password" placeholder="••••••••" aria-label="Password" autocapitalize="none" spellcheck="false">
      <button class="btn" type="submit">GO</button>
    </form>
    <div class="lockMsg" id="lockMsg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="wrap">
    <header class="top">
      <canvas id="rally" aria-hidden="true"></canvas>
      <div class="title">
        <h1><span class="n">NICOLAS</span> <span class="amp">&amp;</span> <span class="f">FELIX</span></h1>
        <p>TENNIS SCORE</p>
      </div>
      <div id="modeBanner" class="hidden"></div>
    </header>

    <section>
      <div class="card chartCard">
        <div class="chartTop">
          <div>
            <p class="eyebrow" id="leadLabel">Set lead · all time</p>
            <div class="lead" id="lead">—</div>
            <div class="leadSub" id="leadSub"></div>
          </div>
          <div class="chartCtrls">
            <div class="seg" id="rangeSeg">
              <button data-r="month">MONTH</button><button data-r="quarter">3 MO</button><button data-r="year">YEAR</button><button data-r="all" class="on">ALL</button>
            </div>
            <div class="seg" id="metricSeg">
              <button data-m="sets" class="on">SETS</button><button data-m="games">GAMES</button>
            </div>
          </div>
        </div>
        <div id="chartBox">
          <svg id="chart" role="img" aria-label="Running lead over time"></svg>
          <div id="tip" class="hidden"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="secHead"><h2><img class="px" data-sprite="sparkle" alt="">STATS</h2><p class="eyebrow" id="statsRange"></p></div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="divider"><img class="px" data-sprite="court_top" data-scale="3" alt=""></div>

    <section>
      <div class="secHead"><h2><img class="px" data-sprite="ball" alt="">MATCHES</h2><p class="eyebrow">Tap a match to edit</p></div>
      <div class="hist" id="hist"></div>
      <div class="more hidden" id="moreWrap"><button class="btn ghost" id="moreBtn">SHOW MORE</button></div>
    </section>

    <footer>
      <span>Unlocked with <code id="pwShow"></code> · synced <span id="syncState">…</span></span>
      <button id="logout">LOG OUT</button>
    </footer>
  </div>

  <button id="fab" aria-label="Log a match"><img class="px" data-sprite="plus" data-fallback="+" alt=""><span>LOG A MATCH</span></button>
</div>

<!-- ============ ADD / EDIT MODAL ============ -->
<dialog id="dlg">
  <form id="dlgForm">
    <div class="mHead"><h3 id="dlgTitle">NEW MATCH</h3><button type="button" class="x" id="dlgClose" aria-label="Close">✕</button></div>
    <div class="mBody">
      <label class="fld" for="mDate">DATE</label>
      <input type="date" id="mDate" required>
      <div id="setList"></div>
      <button type="button" class="addSet" id="addSet">+ ADD ANOTHER SET</button>
    </div>
    <div class="mErr hidden" id="mErr"></div>
    <div class="mFoot">
      <button type="button" class="btn danger hidden" id="delBtn">DELETE</button>
      <button type="submit" class="btn" id="saveBtn">SAVE</button>
    </div>
  </form>
</dialog>

<!-- ============ CELEBRATION ============ -->
<div id="party" class="hidden">
  <div class="partyCard">
    <canvas id="partyCanvas"></canvas>
    <h3 id="partyTitle"></h3>
    <p id="partySub"></p>
    <button class="btn" id="partyOk">OK!</button>
  </div>
</div>

<script type="module">
import { drawSprite, spriteSize, spriteDataURL, ANIMS, SPRITES } from '/tennis/sprites.js';

/* ================================================================
   CONFIG
   Paste the web-app config from Firebase console → Project settings →
   Your apps → Web app. Leave as null to run in local mode
   (data stays in this browser only).
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDJW_EYpuPACWzCVDJJzxwpXRLBCleh_Zg',
  authDomain: 'nicolas-website-4a62d.firebaseapp.com',
  projectId: 'nicolas-website-4a62d',
  storageBucket: 'nicolas-website-4a62d.firebasestorage.app',
  messagingSenderId: '837961761557',
  appId: '1:837961761557:web:d9ba016e7eff0d51999f1c',
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/11.0.2';

// Only a hash of the password lives in this file. The Firestore location
// is derived from the password itself, so reading the source doesn't reveal it.
const CHECK_HASH = '0bcd28232d4f0bbf0550ce85d1043de5e70806b49db0dd958b147fe05e187c1e';
const AUTH_KEY = 'nf-tennis-auth-v1';
// v2 drops the fake demo matches earlier builds stored under v1.
const LOCAL_KEY = 'nf-tennis-local-matches-v2';

const $ = (s, el = document) => el.querySelector(s);
const NAMES = { n: 'Nicolas', f: 'Felix' };
const P = { n: 'nico', f: 'felix' };

/* ---------------- utils ---------------- */
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const fmtDate = (s, opts = { day: 'numeric', month: 'short', year: 'numeric' }) =>
  new Date(s + 'T12:00:00').toLocaleDateString('en-GB', opts);
const storeGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const storeSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const has = name => !!SPRITES[name];
function setSpriteImgs(root = document) {
  root.querySelectorAll('img[data-sprite]').forEach(img => {
    const name = img.dataset.sprite;
    if (has(name)) img.src = spriteDataURL(name, +(img.dataset.scale || 4));
    else if (img.dataset.fallback) img.replaceWith(Object.assign(document.createElement('b'), { textContent: img.dataset.fallback, style: 'font:24px var(--pixel)' }));
    else img.remove();
  });
}

/* ---------------- tennis logic ---------------- */
function setInfo(s) {
  const n = +s.n, f = +s.f, hi = Math.max(n, f), lo = Math.min(n, f);
  const finished = (hi === 6 && lo <= 4) || (hi === 7 && lo === 6) || (hi >= 7 && hi - lo === 2 && lo >= 5);
  return { n, f, winner: n > f ? 'n' : f > n ? 'f' : null, finished, margin: hi - lo,
           tiebreak: hi === 7 && lo === 6, bagel: hi === 6 && lo === 0 };
}
function matchInfo(m) {
  const sets = m.sets.map(setInfo);
  const sn = sets.filter(s => s.winner === 'n').length, sf = sets.filter(s => s.winner === 'f').length;
  const gn = sets.reduce((a, s) => a + s.n, 0), gf = sets.reduce((a, s) => a + s.f, 0);
  const winner = sn !== sf ? (sn > sf ? 'n' : 'f') : gn !== gf ? (gn > gf ? 'n' : 'f') : null;
  return { ...m, sets, sn, sf, gn, gf, winner };
}
const sortMatches = ms => [...ms].sort((a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0));

function rangeStart(r) {
  const d = new Date();
  if (r === 'month') return isoDay(new Date(d.getFullYear(), d.getMonth(), 1));
  if (r === 'quarter') return isoDay(new Date(d.getFullYear(), d.getMonth() - 3, d.getDate()));
  if (r === 'year') return isoDay(new Date(d.getFullYear(), 0, 1));
  return '';
}
const RANGE_LABEL = { month: 'this month', quarter: 'last 3 months', year: 'this year', all: 'all time' };

/* ---------------- data stores ---------------- */
function localStore() {
  const read = () => storeGet(LOCAL_KEY) || [];
  let cb = () => {};
  const write = (ms) => { storeSet(LOCAL_KEY, ms); cb(ms); };
  return {
    mode: 'local',
    subscribe(fn) { cb = fn; fn(read()); },
    async add(m) { write([...read(), { ...m, id: crypto.randomUUID(), ts: Date.now() }]); },
    async update(id, m) { write(read().map(x => x.id === id ? { ...x, ...m } : x)); },
    async remove(id) { write(read().filter(x => x.id !== id)); },
  };
}
async function firestoreStore(boardKey) {
  const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
  const fs = await import(`${FIREBASE_SDK}/firebase-firestore.js`);
  const app = initializeApp(FIREBASE_CONFIG);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(app); }
  const col = fs.collection(db, 'scoreboards', boardKey, 'matches');
  return {
    mode: 'cloud',
    subscribe(fn, onState) {
      fs.onSnapshot(col, { includeMetadataChanges: true }, snap => {
        fn(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        onState(snap.metadata.hasPendingWrites ? 'saving…' : snap.metadata.fromCache ? 'offline (cached)' : 'live ✓');
      }, err => onState('error: ' + err.code));
    },
    add: m => fs.addDoc(col, { ...m, ts: Date.now() }),
    update: (id, m) => fs.updateDoc(fs.doc(col, id), m),
    remove: id => fs.deleteDoc(fs.doc(col, id)),
  };
}
/* ================================================================
   LOCK SCREEN
   ================================================================ */
let store, matches = [], range = 'all', metric = 'sets', histLimit = 8;

async function boot() {
  setSpriteImgs();
  if (has('ball')) $('#lockBall').src = spriteDataURL('ball', 5);
  const auth = storeGet(AUTH_KEY);
  if (auth?.key) return enter(auth, false);
  $('#pw').focus();
  $('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const input = $('#pw'), msg = $('#lockMsg');
    const pw = input.value.trim().toLowerCase();
    if (await sha256('nf-tennis-check:' + pw) !== CHECK_HASH) {
      input.classList.remove('bad'); void input.offsetWidth; input.classList.add('bad');
      msg.className = 'lockMsg bad'; msg.textContent = 'OUT! TRY AGAIN';
      return;
    }
    const auth = { pw, key: await sha256('nf-tennis-board:' + pw) };
    storeSet(AUTH_KEY, auth);
    input.type = 'text'; input.value = pw; input.readOnly = true; input.classList.add('ok');
    msg.className = 'lockMsg ok'; msg.textContent = '✓ GAME, SET, LOGIN!';
    setTimeout(() => enter(auth, true), 900);
  });
}

async function enter(auth, animate) {
  const lock = $('#lock');
  if (animate) { lock.classList.add('fade'); setTimeout(() => lock.remove(), 500); } else lock.remove();
  $('#app').classList.remove('hidden');
  $('#pwShow').textContent = auth.pw;
  startRally();
  bindUi();

  if (FIREBASE_CONFIG) {
    try { store = await firestoreStore(auth.key); }
    catch (err) { console.error(err); store = localStore(); banner('Could not reach Firebase — showing local data only.'); }
  } else {
    store = localStore();
    banner('Local mode: no Firebase config yet, so matches are saved in this browser only.');
  }
  if (store.mode === 'local') $('#syncState').textContent = 'locally only';
  store.subscribe(ms => { matches = sortMatches(ms); render(); }, s => { $('#syncState').textContent = s; });
}
function banner(text) { const b = $('#modeBanner'); b.textContent = text; b.classList.remove('hidden'); }

/* ================================================================
   RENDER
   ================================================================ */
function inRange() {
  const start = rangeStart(range);
  return matches.filter(m => m.date >= start).map(matchInfo);
}

function render() {
  const ms = inRange();
  renderChart(ms);
  renderStats(ms);
  renderHistory(ms);
}

/* ---------- chart ---------- */
function series(ms) {
  const pts = [{ y: 0, start: true }];
  let y = 0;
  for (const m of ms) m.sets.forEach((s, i) => {
    y += metric === 'sets' ? (s.winner === 'n' ? 1 : s.winner === 'f' ? -1 : 0) : s.n - s.f;
    pts.push({ y, m, s, i, who: s.winner });
  });
  return pts;
}

function renderChart(ms) {
  const svg = $('#chart'), pts = series(ms), last = pts[pts.length - 1].y;
  const unit = metric === 'sets' ? 'set' : 'game';
  $('#leadLabel').textContent = `${metric === 'sets' ? 'Set' : 'Game'} lead · ${RANGE_LABEL[range]}`;
  const lead = $('#lead'), sub = $('#leadSub');
  if (pts.length < 2) {
    lead.textContent = '—'; lead.className = 'lead';
    sub.textContent = '';
    svg.innerHTML = '';
    svg.style.height = 'auto';
    $('#chartBox').querySelector('.empty')?.remove();
    const e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = `${has('net') ? `<img class="px" src="${spriteDataURL('net', 3)}" alt="">` : ''}No matches ${range === 'all' ? 'yet' : RANGE_LABEL[range]}. Hit <b>+</b> to log one.`;
    $('#chartBox').append(e);
    return;
  }
  $('#chartBox').querySelector('.empty')?.remove();
  svg.style.height = '';
  if (last === 0) { lead.textContent = 'ALL SQUARE'; lead.className = 'lead'; }
  else { const w = last > 0 ? 'n' : 'f'; lead.textContent = `${NAMES[w].toUpperCase()} +${Math.abs(last)}`; lead.className = 'lead ' + w; }
  const sets = pts.length - 1;
  sub.textContent = last === 0 ? `Dead even after ${sets} set${sets > 1 ? 's' : ''}` :
    `${NAMES[last > 0 ? 'n' : 'f']} is up ${Math.abs(last)} ${unit}${Math.abs(last) > 1 ? 's' : ''} over ${sets} set${sets > 1 ? 's' : ''}`;

  const W = svg.clientWidth || 600, H = 240, padL = 8, padR = 8, padT = 22, padB = 26;
  const maxAbs = Math.max(2, ...pts.map(p => Math.abs(p.y)));
  const yMax = Math.ceil(maxAbs * 1.15);
  const x = i => padL + (W - padL - padR) * (pts.length === 1 ? 0 : i / (pts.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v + yMax) / (2 * yMax));
  const zy = y(0);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const area = `M${x(0)},${zy} L${line.replaceAll(' ', ' L')} L${x(pts.length - 1)},${zy} Z`;
  const gap = (W - padL - padR) / Math.max(1, pts.length - 1);
  const showMarkers = gap >= 5, ms2 = Math.max(2, Math.min(4, Math.floor(gap * .3)));

  // gridlines at integer steps (thinned)
  const step = Math.max(1, Math.ceil(yMax / 4));
  let grid = '';
  for (let v = -Math.floor(yMax / step) * step; v <= yMax; v += step) {
    if (v === 0) continue;
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="#e8e0cc" stroke-width="1"/>`
         + `<text x="${W - padR}" y="${y(v) - 3}" text-anchor="end" font-size="9" fill="#a39d8c" font-family="Inter">${v > 0 ? '+' : ''}${v}</text>`;
  }
  const dates = pts.slice(1).map(p => p.m.date);
  const xLabels = [[1, dates[0]], [pts.length - 1, dates[dates.length - 1]]];
  if (pts.length > 8) xLabels.splice(1, 0, [Math.round(pts.length / 2), pts[Math.round(pts.length / 2)].m.date]);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <defs>
      <clipPath id="cTop"><rect x="0" y="0" width="${W}" height="${zy}"/></clipPath>
      <clipPath id="cBot"><rect x="0" y="${zy}" width="${W}" height="${H - zy}"/></clipPath>
      <pattern id="dotsN" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="var(--nico)"/></pattern>
      <pattern id="dotsF" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="var(--felix)"/></pattern>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#dotsN)" opacity=".55" clip-path="url(#cTop)"/>
    <path d="${area}" fill="url(#dotsF)" opacity=".55" clip-path="url(#cBot)"/>
    <line x1="${padL}" x2="${W - padR}" y1="${zy}" y2="${zy}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 5"/>
    <polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="miter"/>
    ${showMarkers ? pts.map((p, i) => i === 0 ? '' :
      `<rect x="${x(i) - ms2}" y="${y(p.y) - ms2}" width="${ms2 * 2}" height="${ms2 * 2}" fill="${p.who === 'n' ? 'var(--nico)' : p.who === 'f' ? 'var(--felix)' : '#fff'}" stroke="var(--ink)" stroke-width="2"/>`).join('') : ''}
    <text x="${padL}" y="12" font-family="Press Start 2P" font-size="9" fill="var(--nico)">▲ NICOLAS</text>
    <text x="${padL}" y="${H - padB - 6}" font-family="Press Start 2P" font-size="9" fill="var(--felix)">▼ FELIX</text>
    ${xLabels.map(([i, d], k) => `<text x="${x(i)}" y="${H - 6}" font-size="10" fill="#8a8473" font-family="Inter" text-anchor="${k === 0 ? 'start' : k === xLabels.length - 1 ? 'end' : 'middle'}">${fmtDate(d, { day: 'numeric', month: 'short', year: '2-digit' })}</text>`).join('')}
    <line id="hoverLine" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="var(--ink)" stroke-width="1" opacity="0"/>
    <rect id="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  `;

  const tip = $('#tip'), hl = $('#hoverLine');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) * (W / r.width);
    let i = Math.round((px - padL) / ((W - padL - padR) / Math.max(1, pts.length - 1)));
    i = Math.max(1, Math.min(pts.length - 1, i));
    const p = pts[i];
    hl.setAttribute('x1', x(i)); hl.setAttribute('x2', x(i)); hl.setAttribute('opacity', '.35');
    const setLbl = p.m.sets.length > 1 ? ` · set ${p.i + 1}` : '';

  const hit = $('#hit', svg);
  hit.addEventListener('mousemove', move); hit.addEventListener('mouseleave', leave);
  hit.addEventListener('touchstart', move, { passive: true }); hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('touchend', () => setTimeout(leave, 1600));
}

/* ---------- stats ---------- */
function streaks(sets) {
  let cur = null, len = 0; const best = { n: 0, f: 0 };
  for (const s of sets) {
    if (!s.winner) continue;
    if (s.winner === cur) len++; else { cur = s.winner; len = 1; }
    best[cur] = Math.max(best[cur], len);
  }
  return { cur, len, best };
}
function renderStats(ms) {
  $('#statsRange').textContent = RANGE_LABEL[range];
  const el = $('#stats');
  if (!ms.length) { el.innerHTML = `<div class="card stat wide"><p class="eyebrow">Nothing here yet</p><div class="sub">Stats appear once you log a match.</div></div>`; return; }
  const sets = ms.flatMap(m => m.sets.map(s => ({ ...s, date: m.date })));
  const sn = sets.filter(s => s.winner === 'n').length, sf = sets.filter(s => s.winner === 'f').length;
  const gn = sets.reduce((a, s) => a + s.n, 0), gf = sets.reduce((a, s) => a + s.f, 0);
  const mn = ms.filter(m => m.winner === 'n').length, mf = ms.filter(m => m.winner === 'f').length;
  const st = streaks(sets);
  const bestWin = w => sets.filter(s => s.winner === w && s.finished).sort((a, b) => b.margin - a.margin || b.date.localeCompare(a.date))[0];
  const closest = [...ms].filter(m => m.winner).sort((a, b) => Math.abs(a.gn - a.gf) - Math.abs(b.gn - b.gf) || b.date.localeCompare(a.date))[0];
  const tb = sets.filter(s => s.tiebreak).length, bagels = sets.filter(s => s.bagel).length, unfinished = sets.filter(s => !s.finished).length;
  const tug = (a, b) => { const t = a + b || 1; return `<div class="tug"><i class="n" style="width:${a / t * 100}%"></i><i class="f" style="width:${b / t * 100}%"></i></div><div class="tugLbl"><span class="n">${a}</span><span class="f">${b}</span></div>`; };
  const score = s => s ? `${Math.max(s.n, s.f)}–${Math.min(s.n, s.f)} <span style="color:var(--muted);font-size:12px">· ${fmtDate(s.date, { day: 'numeric', month: 'short' })}</span>` : '<span style="color:var(--muted)">—</span>';

  el.innerHTML = `
    <div class="card stat"><p class="eyebrow">Matches</p><div class="big">${ms.length}</div><div class="sub">${mn}–${mf} in matches</div></div>
    <div class="card stat"><p class="eyebrow">Sets</p><div class="big">${sets.length}</div><div class="sub">${unfinished ? unfinished + ' unfinished' : 'all played out'}</div></div>
    <div class="card stat"><p class="eyebrow">Games</p><div class="big">${gn + gf}</div><div class="sub">~${(ms.length ? (gn + gf) / ms.length : 0).toFixed(1)} per match</div></div>
    <div class="card stat"><p class="eyebrow">Hot streak</p><div class="big ${st.cur || ''}">${st.cur ? NAMES[st.cur].toUpperCase() + ' ×' + st.len : '—'}</div><div class="sub">sets in a row now</div></div>
    <div class="card stat wide"><p class="eyebrow">Sets won</p>${tug(sn, sf)}</div>
    <div class="card stat wide"><p class="eyebrow">Games won</p>${tug(gn, gf)}</div>
    <div class="card stat wide"><p class="eyebrow">Best wins</p><div class="pair"><b class="n">NICOLAS</b><span>${score(bestWin('n'))}</span><b class="f">FELIX</b><span>${score(bestWin('f'))}</span></div></div>
    <div class="card stat"><p class="eyebrow">Closest match</p><div class="big" style="font-size:16px">${closest ? closest.sets.map(s => s.n + '–' + s.f).join(' ') : '—'}</div><div class="sub">${closest ? fmtDate(closest.date) + ' · ' + NAMES[closest.winner] : ''}</div></div>
    <div class="card stat"><p class="eyebrow">Longest streak</p><div class="pair"><b class="n">NICO</b><span>${st.best.n} sets</span><b class="f">FELIX</b><span>${st.best.f} sets</span></div><div class="sub" style="margin-top:8px">${tb} tiebreak${tb === 1 ? '' : 's'} · ${bagels} bagel${bagels === 1 ? '' : 's'} 🥯</div></div>
  `;
}

/* ---------- history ---------- */
function renderHistory(ms) {
  const el = $('#hist');
  const list = [...ms].reverse();
  if (!list.length) { el.innerHTML = `<div class="empty card">No matches ${range === 'all' ? 'yet' : RANGE_LABEL[range]}.</div>`; $('#moreWrap').classList.add('hidden'); return; }
  el.innerHTML = '';
  list.slice(0, histLimit).forEach(m => {
    const b = document.createElement('button'); b.className = 'row';
    b.innerHTML = `<span class="date">${fmtDate(m.date, { weekday: 'short', day: 'numeric', month: 'short', ...(m.date.slice(0, 4) === today().slice(0, 4) ? {} : { year: 'numeric' }) }).toUpperCase().replace(',', '')}</span>
      <span class="sets">${m.sets.map(s => `<span class="chip ${s.winner ? 'w' + s.winner : ''}"><span class="n">${s.n}</span>–<span class="f">${s.f}</span>${s.finished ? '' : '<small>unfin.</small>'}${s.tiebreak ? '<small>TB</small>' : ''}</span>`).join('')}</span>
      <span class="who ${m.winner || ''}">${m.winner ? NAMES[m.winner].toUpperCase() : 'DRAW'}</span>`;
    b.addEventListener('click', () => openDialog(m));

  });
  $('#moreWrap').classList.toggle('hidden', list.length <= histLimit);
}

/* ================================================================
   ADD / EDIT DIALOG
   ================================================================ */
let editing = null, draftSets = [];
function openDialog(m = null) {
  editing = m;
  $('#dlgTitle').textContent = m ? 'EDIT MATCH' : 'NEW MATCH';
  $('#mDate').value = m ? m.date : today();
  $('#mDate').max = today();
  draftSets = m ? m.sets.map(s => ({ n: s.n, f: s.f })) : [{ n: null, f: null }];
  $('#delBtn').classList.toggle('hidden', !m);
  $('#delBtn').textContent = 'DELETE'; delete $('#delBtn').dataset.armed;
  $('#mErr').classList.add('hidden');
  drawSets();
  $('#dlg').showModal();
}
function drawSets() {
  const list = $('#setList'); list.innerHTML = '';
  draftSets.forEach((s, idx) => {
    const box = document.createElement('div'); box.className = 'setBox';
    const row = who => `<div class="pick ${who}"><span class="nm ${who}">${has(P[who] + '_ready') ? `<img class="px" src="${spriteDataURL(P[who] + '_ready', 2)}" alt="">` : ''}${NAMES[who].toUpperCase()}</span>${
      [0,1,2,3,4,5,6,7].map(v => `<button type="button" data-who="${who}" data-v="${v}" class="${s[who] === v ? 'on' : ''}">${v}</button>`).join('')}</div>`;
    box.innerHTML = `<div class="setTop"><b>SET ${idx + 1}</b>${draftSets.length > 1 ? '<button type="button" class="rm">REMOVE</button>' : ''}</div>${row('n')}${row('f')}<div class="verdict"></div>`;
    box.querySelectorAll('.pick button').forEach(btn => btn.addEventListener('click', () => {
      s[btn.dataset.who] = +btn.dataset.v;
      box.querySelectorAll(`.pick.${btn.dataset.who} button`).forEach(x => x.classList.toggle('on', x === btn));
      verdict(box, s);
    }));
    box.querySelector('.rm')?.addEventListener('click', () => { draftSets.splice(idx, 1); drawSets(); });
    verdict(box, s);
    list.append(box);
  });
  $('#addSet').classList.toggle('hidden', draftSets.length >= 5);
}
function verdict(box, s) {
  const v = box.querySelector('.verdict');
  if (s.n == null || s.f == null) { v.textContent = 'Tap the games each of you won.'; return; }
  const i = setInfo(s);
  if (!i.winner) { v.innerHTML = `Tied ${s.n}–${s.f}: nobody gets this set <span class="tag">UNFINISHED</span>`; return; }
  v.innerHTML = `<b class="${i.winner}">${NAMES[i.winner]}</b> takes the set ${Math.max(s.n, s.f)}–${Math.min(s.n, s.f)}${i.finished ? (i.tiebreak ? ' in a tiebreak' : i.bagel ? '. A bagel! 🥯' : '') : ' <span class="tag">UNFINISHED</span>'}`;
}
async function saveDialog() {
  const err = $('#mErr');
  const date = $('#mDate').value;
  const sets = draftSets.filter(s => s.n != null && s.f != null && (s.n + s.f) > 0);
  if (!date) { err.textContent = 'Pick a date.'; err.classList.remove('hidden'); return; }
  if (!sets.length || sets.length !== draftSets.length) { err.textContent = 'Fill in the score for every set (or remove empty ones).'; err.classList.remove('hidden'); return; }
  const payload = { date, sets: sets.map(s => ({ n: s.n, f: s.f })) };
  $('#saveBtn').disabled = true;
  try {
    if (editing) { await store.update(editing.id, payload); $('#dlg').close(); }
    else {
      // Firestore resolves add() only once the server acks; the write is already
      // queued locally, so close + celebrate right away and only surface failures.
      store.add(payload).catch(e => { console.error(e); banner('Saving failed: ' + (e.code || e.message)); });
      $('#dlg').close();
      celebrate(matchInfo(payload));
    }
  } catch (e) {
    console.error(e); err.textContent = 'Could not save: ' + (e.code || e.message); err.classList.remove('hidden');
  } finally { $('#saveBtn').disabled = false; }
}

const segOn = (sel, b) => $(sel).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));

/* ================================================================
   HEADER RALLY ANIMATION
   ================================================================ */
function fitCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3), r = { width: cv.offsetWidth, height: cv.offsetHeight };
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
  return { ctx, w: r.width, h: r.height };
}
function animFrame(anim, t0, now, hold = true) {
  const a = ANIMS[anim]; const i = Math.floor((now - t0) / a.ms);
  return { name: a.frames[hold ? Math.min(i, a.frames.length - 1) : i % a.frames.length], done: i >= a.frames.length };
}

function startRally() {
  const cv = $('#rally');
  let g = fitCanvas(cv);
  addEventListener('resize', () => { g = fitCanvas(cv); });
  const FLIGHT = 1150;
  const player = { n: { anim: null, t0: 0 }, f: { anim: null, t0: 0 } };
  let shot = { from: 'n', t0: performance.now() + 600, kind: 'rally' }, flashes = [], shots = 0;
  player.n.anim = 'nico_serve'; player.n.t0 = shot.t0 - contactOffset('nico_serve');

  function contactOffset(anim) {
    const a = ANIMS[anim]; if (!a) return 0;
    let idx = a.frames.findIndex(f => /_swing2$|_serve2$/.test(f));
    if (idx < 0) idx = 1;
    return idx * a.ms + a.ms / 2;
  }
  function layout() {
    const { w, h } = g;
    const scale = w < 420 ? 2 : w < 760 ? 3 : 4;
    const { w: sw, h: sh } = spriteSize('nico_ready');
    const ground = h - 18;
    return { scale, sw: sw * scale, sh: sh * scale, ground, nx: 4, fx: w - 4 - sw * scale };
  }
  function contactPoint(who, L) {
    return who === 'n' ? { x: L.nx + L.sw * .92, y: L.ground - L.sh * .55 } : { x: L.fx + L.sw * .08, y: L.ground - L.sh * .55 };
  }
  function ballPos(L, now) {
    const u = Math.min(1, (now - shot.t0) / FLIGHT);
    const A = contactPoint(shot.from, L), C = contactPoint(shot.from === 'n' ? 'f' : 'n', L);
    const Bx = A.x + (C.x - A.x) * .72, By = L.ground - 3;
    const peak = Math.min(110, g.h * .65);
    if (u < .72) { const v = u / .72; return { x: A.x + (Bx - A.x) * v, y: A.y + (By - A.y) * v - peak * 4 * v * (1 - v) * .55, u }; }
    const v = (u - .72) / .28; return { x: Bx + (C.x - Bx) * v, y: By + (C.y - By) * v - peak * .35 * 4 * v * (1 - v), u };
  }

  function frame(now) {
    const { ctx, w, h } = g, L = layout();
    ctx.clearRect(0, 0, w, h);
    // ground: thin court strip with baseline + net
    ctx.fillStyle = '#e6dcc4'; ctx.fillRect(0, L.ground, w, 4);
    ctx.fillStyle = '#d9d1bd'; for (let x = 0; x < w; x += 12) ctx.fillRect(x, L.ground + 9, 6, 3);
    if (has('net')) { const { w: nw, h: nh } = spriteSize('net'); const s = L.scale - 1 || 1; drawSprite(ctx, 'net', Math.round(w / 2 - nw * s / 2), Math.round(L.ground - nh * s + 2), s); }

    // shot bookkeeping
    if (now >= shot.t0) {
      const recv = shot.from === 'n' ? 'f' : 'n';
      const arrive = shot.t0 + FLIGHT;
      const rallyAnim = `${P[recv]}_rally`;
      if (!player[recv].anim && now >= arrive - contactOffset(rallyAnim)) { player[recv].anim = rallyAnim; player[recv].t0 = now; }
      if (now >= arrive) {
        shots++;
        const smash = shots % 6 === 5;
        if (smash || Math.random() < .25) flashes.push({ who: recv, t: now, kind: smash ? 'smash' : 'sparkle' });
        shot = { from: recv, t0: arrive };
      }
    }
    // players
    for (const who of ['n', 'f']) {
      const p = player[who];
      let name;
      if (p.anim) { const fr = animFrame(p.anim, p.t0, now); name = fr.name; if (fr.done) p.anim = null; }
      if (!name) name = animFrame(`${P[who]}_idle`, 0, now, false).name;
      const { w: sw, h: sh } = spriteSize(name);
      const x = who === 'n' ? L.nx : L.fx;
      // shadow
      ctx.fillStyle = 'rgba(27,27,42,.13)'; ctx.fillRect(x + L.sw * .2, L.ground - 2, L.sw * .6, 4);
      drawSprite(ctx, name, Math.round(x), Math.round(L.ground - sh * L.scale), L.scale, who === 'f');
    }
    // ball + shadow
    if (now >= shot.t0) {
      const b = ballPos(L, now);
      const bs = has('ball') ? spriteSize('ball') : { w: 6, h: 6 }, s = Math.max(2, L.scale - 1);
      ctx.globalAlpha = .18; ctx.fillStyle = '#1b1b2a';
      const shW = Math.max(4, 12 - (L.ground - b.y) / 10) * s / 2;
      ctx.fillRect(Math.round(b.x - shW / 2), L.ground - 1, Math.round(shW), 3); ctx.globalAlpha = 1;
      if (has('ball')) drawSprite(ctx, 'ball', Math.round(b.x - bs.w * s / 2), Math.round(b.y - bs.h * s / 2), s);
      else { ctx.fillStyle = '#d9f24b'; ctx.fillRect(b.x - 5, b.y - 5, 10, 10); }
    }
    // impact flashes
    flashes = flashes.filter(fl => now - fl.t < 260);
    for (const fl of flashes) {
      if (!has(fl.kind)) continue;
      const c = contactPoint(fl.who, L), { w: fw, h: fh } = spriteSize(fl.kind), s = Math.max(2, L.scale - 1);
      drawSprite(ctx, fl.kind, Math.round(c.x - fw * s / 2), Math.round(c.y - fh * s / 2), s, fl.who === 'f');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ================================================================
   CELEBRATION
   ================================================================ */
let partyRaf = null;
function celebrate(m) {
  const party = $('#party'); party.classList.remove('hidden');
  const W = m.winner, Lz = W ? (W === 'n' ? 'f' : 'n') : null;
  // scores read from the winner's side, as they're said in tennis
  const score = m.sets.map(s => m.winner === 'f' ? `${s.f}–${s.n}` : `${s.n}–${s.f}`).join(', ');
  $('#partyTitle').innerHTML = W ? `<span class="${W}">${NAMES[W].toUpperCase()}</span> WINS!` : `IT'S A DRAW!`;
  $('#partySub').textContent = W ? pick([`${score}. Bragging rights secured.`, `${score}. ${NAMES[Lz]} demands a rematch.`, `${score}. What a match!`, `${score}. Game, set, match.`]) : `${score}. Nobody's buying the drinks.`;
  const winAnim = W ? `${P[W]}_win${1 + Math.floor(Math.random() * 3)}` : null;
  const loseAnim = W ? `${P[Lz]}_lose${1 + Math.floor(Math.random() * 3)}` : null;
  const cv = $('#partyCanvas'); const g = fitCanvas(cv); const t0 = performance.now();
  const confetti = Array.from({ length: 70 }, () => ({ x: Math.random() * g.w, y: -Math.random() * g.h, v: 40 + Math.random() * 70, c: pick(['#d9f24b', '#e2483d', '#2e9b57', '#f0be45', '#4f74a8']), s: 3 + Math.floor(Math.random() * 3), d: Math.random() * 6 }));
  cancelAnimationFrame(partyRaf);
  const draw = now => {
    const { ctx, w, h } = g; ctx.clearRect(0, 0, w, h);
    const t = (now - t0) / 1000;
    if (W) {
      const { w: sw, h: sh } = spriteSize(`${P[W]}_ready`), ws = Math.max(2, Math.min(5, Math.floor((h - 64 - 36) / sh)));
      // winner: front & centre, on a little podium; loser: smaller, down in the corner
      const podW = sw * ws * .9, podX = w * .42 - podW / 2, podY = h - 64;
      ctx.fillStyle = '#f0be45'; ctx.fillRect(podX, podY, podW, 64); ctx.fillStyle = '#1b1b2a'; ctx.fillRect(podX, podY, podW, 4);
      ctx.font = '18px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText('1', podX + podW / 2, podY + 42);
      const wn = animFrame(winAnim, 0, now, false).name;
      drawSprite(ctx, wn, Math.round(w * .42 - sw * ws / 2), Math.round(podY - sh * ws), ws, W === 'f');
      if (has('crown') && t > .4) { const c = spriteSize('crown'); drawSprite(ctx, 'crown', Math.round(w * .42 - c.w * 2), Math.round(podY - sh * ws - c.h * 4 - 4 + Math.sin(t * 6) * 2), 4); }
      const ls = 3, ln = animFrame(loseAnim, 0, now, false).name, l = spriteSize(ln);
      drawSprite(ctx, ln, Math.round(w * .82 - l.w * ls / 2), Math.round(h - l.h * ls), ls, Lz === 'n');
    } else {
      for (const who of ['n', 'f']) {
        const nm = animFrame(`${P[who]}_idle`, 0, now, false).name, s = spriteSize(nm), sc = 4;
        drawSprite(ctx, nm, Math.round((who === 'n' ? w * .3 : w * .7) - s.w * sc / 2), Math.round(h - s.h * sc), sc, who === 'f');
      }
    }
    for (const p of confetti) {
      p.y += p.v / 60; p.x += Math.sin(t * 3 + p.d) * .6; if (p.y > h) { p.y = -10; p.x = Math.random() * w; }
      ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    }
    partyRaf = requestAnimationFrame(draw);
  };
  partyRaf = requestAnimationFrame(draw);
}
function closeParty() { cancelAnimationFrame(partyRaf); $('#party').classList.add('hidden'); }

boot();
</script>
